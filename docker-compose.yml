name: sibssnapsclient

services:
  web:
    container_name: SiBS-Snaps-Client
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_APP_NAME: ${VITE_APP_NAME:-SiBS Snaps}
    ports:
      - "5015:80"
    # Separate Client / Server Compose stacks communicate via the Docker host.
    # Required on Linux so nginx.conf can resolve host.docker.internal:6101.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
