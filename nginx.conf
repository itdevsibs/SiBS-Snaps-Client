# Production web app: one public origin for React and the Anniversary API.
# This file is copied into /etc/nginx/conf.d/default.conf by the Dockerfile.
# Docker Compose maps host.docker.internal to the Docker host on Linux.
# The SiBS-Snaps Server listens on the Docker host's port 6101.

# Respect the public HTTPS scheme supplied by the external reverse proxy.
# For direct HTTP connections, use Nginx's own scheme instead.
map $http_x_forwarded_proto $snaps_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # One 10 MiB image plus multipart form overhead.
    client_max_body_size 12m;

    # IMPORTANT: this block must precede the React SPA fallback.
    # No trailing slash on proxy_pass: Express expects the original /api path.
    # Includes upload, thumbnails, moderator APIs and EventSource /stream.
    location ^~ /api/ {
        proxy_pass http://host.docker.internal:6101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $snaps_forwarded_proto;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;

        # Required for real-time EventSource messages, not buffered HTML.
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # React Router routes (e.g. /photo-wall/display) are served by Vite's index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
